# Hạ tầng cho bản demo: Qdrant (vector DB) + SQL Server (dữ liệu mẫu).
# Ollama chạy trực tiếp trên máy (để dùng GPU) — xem README.
# Mật khẩu đặt trong file .env (copy từ .env.example).
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC (ứng dụng dùng cổng này)
    volumes:
      - qdrant_data:/qdrant/storage

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Đặt MSSQL_SA_PASSWORD trong file .env}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  qdrant_data:
  sql_data:
